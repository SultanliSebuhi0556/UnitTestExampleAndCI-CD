name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: "10"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}

      - name: Restore dependencies
        working-directory: ./UnitTestExample
        run: dotnet restore

      - name: Build app
        working-directory: ./UnitTestExample
        run: dotnet build --configuration Release

      - name: Run tests
        working-directory: ./UnitTestExample
        run: dotnet test ../UnitTestExample.Tests/UnitTestExample.Tests.csproj --no-build --configuration Release --verbosity normal
